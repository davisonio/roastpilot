<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roast — design exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #ece7df; }
  body { font-family: Inter, system-ui, sans-serif; }

  /* ─── Roast palette + globals ───────────────────────────── */
  :root {
    --ink: #0a0706;
    --surface: #1a1412;
    --surface-2: #221a17;
    --cool: #5c6878;
    --ember-1: #ff6b1a;
    --ember-2: #ff8c42;
    --ember-3: #ffb347;
    --ember-4: #ffd96e;
    --text: #f4ede4;
    --text-dim: #a89c8c;
    --text-mute: #6b6259;
    --hairline: rgba(244,237,228,0.08);
    --serif: 'Lora', 'Cooper', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  /* Frames using these classes get the dark warm app background */
  .roast-app {
    background: #0a0706;
    color: #f4ede4;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  .roast-app, .roast-app * { box-sizing: border-box; }

  /* Subtle ember-tinted vignette behind everything dark */
  .roast-vignette::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 50% 110%, rgba(255,107,26,0.06), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% -20%, rgba(255,107,26,0.025), transparent 70%);
  }

  /* ─── Heat glow utility ─────────────────────────────────── */
  /* heat: 0 (cool slate) → 1..4 (ember progression) */
  .roast-card {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--hairline);
    transition: box-shadow 600ms ease, border-color 600ms ease;
    position: relative;
  }
  .heat-0 {
    border-color: rgba(92,104,120,0.18);
    box-shadow:
      0 0 0 1px rgba(92,104,120,0.08),
      0 12px 32px -16px rgba(92,104,120,0.25);
  }
  .heat-1 {
    border-color: rgba(255,107,26,0.12);
    box-shadow:
      0 0 0 1px rgba(255,107,26,0.06),
      0 0 24px -8px rgba(255,107,26,0.18);
  }
  .heat-2 {
    border-color: rgba(255,140,66,0.20);
    box-shadow:
      0 0 0 1px rgba(255,140,66,0.10),
      0 0 32px -6px rgba(255,140,66,0.30),
      0 0 80px -20px rgba(255,107,26,0.30);
  }
  .heat-3 {
    border-color: rgba(255,179,71,0.32);
    box-shadow:
      0 0 0 1px rgba(255,179,71,0.16),
      0 0 40px -4px rgba(255,140,66,0.45),
      0 0 120px -20px rgba(255,107,26,0.50);
  }
  .heat-4 {
    border-color: rgba(255,217,110,0.45);
    box-shadow:
      0 0 0 1px rgba(255,217,110,0.22),
      0 0 56px 0 rgba(255,140,66,0.55),
      0 0 160px -20px rgba(255,107,26,0.65),
      inset 0 0 60px -30px rgba(255,217,110,0.20);
  }

  /* ─── Animations ────────────────────────────────────────── */
  @keyframes breathe-headline {
    0%, 100% { opacity: 0.92; }
    50%      { opacity: 1; }
  }
  .headline-breathe { animation: breathe-headline 4s ease-in-out infinite; }

  @keyframes ember-pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px 8px rgba(255,107,26,0.45), 0 0 100px 20px rgba(255,107,26,0.25), inset 0 0 30px rgba(255,217,110,0.4); }
    50%      { transform: scale(1.18); box-shadow: 0 0 80px 14px rgba(255,140,66,0.65), 0 0 180px 40px rgba(255,107,26,0.4), inset 0 0 30px rgba(255,217,110,0.7); }
  }
  .ember-breath { animation: ember-pulse 8s ease-in-out infinite; }

  @keyframes flame-flicker {
    0%, 100% { transform: scaleY(1)   translateY(0)   skewX(0deg); opacity: .96; }
    25%      { transform: scaleY(1.06) translateY(-1px) skewX(-2deg); opacity: 1; }
    50%      { transform: scaleY(0.94) translateY(0.5px) skewX(1deg); opacity: .92; }
    75%      { transform: scaleY(1.04) translateY(-0.5px) skewX(2deg); opacity: 1; }
  }
  .flame-anim { animation: flame-flicker 1.7s ease-in-out infinite; transform-origin: 50% 100%; }
  .flame-anim-slow { animation: flame-flicker 2.6s ease-in-out infinite; transform-origin: 50% 100%; }

  @keyframes particle-rise {
    0%   { transform: translateY(0)    scale(1);   opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translateY(-80px) scale(0.4); opacity: 0; }
  }

  @keyframes log-blink {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 1; }
  }
  .log-cursor { animation: log-blink 1.2s steps(1) infinite; }

  /* small caps style */
  .smallcaps {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 500;
  }

  /* invisible scrollbars in app frames */
  .roast-app *::-webkit-scrollbar { display: none; }
  .roast-app * { scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
